# Merge this table into ~/.codex/config.toml after replacing both paths.
[mcp_servers.aurora_air_pollution]
command = "/absolute/path/aurora/.venv-workflow/bin/python"
args = ["-m", "aurora_workflow.mcp_server", "--config", "/absolute/path/aurora-local.json"]
cwd = "/absolute/path/aurora"
startup_timeout_sec = 30
tool_timeout_sec = 60
