paths:
  project_root: .
  data_dir: ../data
  data_case_name: NO2_US-WEST_3day_lead  # Reuse prepared NO2 data; case_name separates artifacts.
  output_dir: ./outputs
  checkpoint_dir: ./outputs/checkpoints
  pretrained_checkpoint: ""  # Optional local checkpoint path. Empty uses model default HF checkpoint.
  static_data_path: /data/cams/aurora-0.4-air-pollution-static.pickle  # Pickle with lsm, z, slt (from HuggingFace)

# Sub-folder under output_dir / checkpoint_dir for this experiment.
# When set, all artifacts (best.ckpt, last.ckpt, training_history.*,
# rollout_predictions.nc, plots, run_manifest.json) land in
#   <output_dir>/<case_name>/  and  <checkpoint_dir>/<case_name>/
# resume_from="best"/"last" resolves relative to the case folder, so
# stages chain naturally when you keep case_name fixed across runs.
case_name: NO2_US-WEST_3day_lead_diffusion_transformer

data:
  predictor_variables:
    - dataset_name: t2m
      aurora_name: 2t
      kind: surf
    - dataset_name: u10
      aurora_name: 10u
      kind: surf
    - dataset_name: v10
      aurora_name: 10v
      kind: surf
    - dataset_name: msl
      aurora_name: msl
      kind: surf
    - dataset_name: tcno2
      aurora_name: tcno2
      kind: surf
    - dataset_name: z
      aurora_name: z
      kind: atmos
    - dataset_name: u
      aurora_name: u
      kind: atmos
    - dataset_name: v
      aurora_name: v
      kind: atmos
    - dataset_name: t
      aurora_name: t
      kind: atmos
    - dataset_name: q
      aurora_name: q
      kind: atmos
    - dataset_name: no2
      aurora_name: no2
      kind: atmos

  target_variables:
    - dataset_name: no2
      aurora_name: no2
      kind: atmos
      # Compute loss and train the refinement head at these pressure levels.
      # Other levels remain Aurora backbone output; the full atmospheric level
      # grid remains in data.atmos_levels for backbone/checkpoint compatibility.
      units: kg kg-1
      loss_levels: [1000, 925, 850]
    - dataset_name: tcno2
      aurora_name: tcno2
      kind: surf
      units: kg m-2

  static_variables:
    - dataset_name: lsm
      aurora_name: lsm
      kind: static
    - dataset_name: z_static
      aurora_name: z
      kind: static
    - dataset_name: slt
      aurora_name: slt
      kind: static
    - dataset_name: static_ammonia
      aurora_name: static_ammonia
      kind: static
    - dataset_name: static_ammonia_log
      aurora_name: static_ammonia_log
      kind: static
    - dataset_name: static_co
      aurora_name: static_co
      kind: static
    - dataset_name: static_co_log
      aurora_name: static_co_log
      kind: static
    - dataset_name: static_nox
      aurora_name: static_nox
      kind: static
    - dataset_name: static_nox_log
      aurora_name: static_nox_log
      kind: static
    - dataset_name: static_so2
      aurora_name: static_so2
      kind: static
    - dataset_name: static_so2_log
      aurora_name: static_so2_log
      kind: static

  atmos_levels: [50, 100, 150, 200, 250, 300, 400, 500, 600, 700, 850, 925, 1000]
  input_time_steps: 2
  target_lead_times: [1,2,3,4,5,6]  # Multi-step rollout supervision at these target lead indices (1 step = rollout_step_hours).
  target_type: rollout  # next-step | multi-step | rollout

  nonnegative_target_variables: [no2, tcno2]
  domain_type: regional  # global | regional
  lat_min: 31.0
  lat_max: 52.0
  lon_min: -128.0
  lon_max: -100.0

  data_format: netcdf  # netcdf | zarr | xarray
  backend: netcdf
  predictor_mapping_to_aurora_names: {}
  target_mapping_from_aurora_outputs: {}
  static_mapping_to_aurora_names: {}

  time_dim: time
  lat_dim: latitude
  lon_dim: longitude
  level_dim: level
  extra_dim_indexers: {}  # Example: {member: 0}

  normalization:
    enabled: false
    mode: none
    input_stats: {}
    target_stats: {}

  split_controls:
    train:
      start_offset: 0
      end_offset: null
      stride: 1
      max_samples: null
    val:
      start_offset: 0
      end_offset: null
      stride: 1
      max_samples: null
    test:
      start_offset: 0
      end_offset: null
      stride: 1
      max_samples: null

  optional_masks_for_missing_values: {}  # Example: {t2m: valid_mask_t2m}

  loss_mask_options:
    mode: none  # none | land | ocean
    threshold: 0.5

  include_target_variables_as_predictors: false
  patch_alignment_strategy: crop

model:
  model_variant: aurora_air_pollution
  patch_size: 3  # AuroraAirPollution uses patch_size=3.
  lon_periodic: auto  # Resolves false for this regional, non-wrapping domain.
  use_pretrained_weights: true
  gradient_checkpointing: false  # Phase-1 Aurora is frozen by refinement.freeze_aurora.
  mixed_precision: bf16  # none | bf16 | fp16
  refinement:
    enabled: true
    type: diffusion_transformer
    correction_convention: cams_minus_aurora_add
    checkpoint: null
    freeze_aurora: true
    joint_finetuning: false
    # Repository-wide correction contract (including serialization/evaluation):
    #   correction_target = CAMS - Aurora
    #   refined_forecast = Aurora + predicted_correction
    train_on_residual: true
    feedback_to_rollout: false
    seed: 1234
    # The default forecast product is the deterministic conditional mean.
    # For uncertainty experiments set deterministic_inference=false and use
    # ensemble_size >= 2; never evaluate one arbitrary stochastic member as the
    # "fine-tuned forecast".
    ensemble_size: 1
    deterministic_inference: true

    target_space:
      use_existing_normalization: true
      residual_space: normalized
      # Fit one finite, masked training-split mean/std for every packed
      # variable/pressure-level channel and restore both exactly once.
      residual_scaling: per_channel
      residual_scaling_center: true
      residual_scaling_momentum: 0.05
      residual_scaling_warmup_batches: 32
      residual_scaling_target_std: 1.0

    conditioning:
      aurora_rollout: true
      aurora_input_state: false
      aurora_features: false
      static_fields: false
      masks: true
      forecast_lead_time: true

    loss:
      generative: mse
      # Directly train and score the deterministic correction that is deployed;
      # diffusion noise loss alone is not a checkpoint-quality metric.
      deterministic_weight: 1.0
      aux_on_deterministic: true
      reconstruction_weight: 0.0
      mae_weight: 0.0
      bias_weight: 1.0
      gradient_weight: 0.25
      pattern_correlation_weight: 0.5
      variance_weight: 2.0
      extreme_weight: 1.0
      extreme_quantile: 0.95
      extreme_intensity: 4.0
      quantile_weight: 1.0
      peak_weight: 0.0
      spectral_weight: 0.0
      degradation_weight: 1.0
      magnitude_weight: 0.0
      area_weighted: true
      separate_by_variable: true
      separate_by_level: true
      separate_by_lead_time: true

    # Retained in this consolidated NO2 recipe so changing `type` to
    # flow_matching_transformer is explicit and does not inherit an accidental
    # scheduler/path default. The shared target, scaler, deterministic mean,
    # conditioning, losses, checkpoint metric, and constraints stay unchanged.
    flow_matching:
      source_distribution: gaussian
      interpolation_path: existing_aurora
      integration_steps: 50
      solver: heun
      stochastic_initialization: true
      time_sampling: logit_normal
      sigma_min: 1.0e-3
      logit_normal_mean: -0.5
      logit_normal_std: 1.2
      residual_zscore: false  # shared per-channel correction scaler is authoritative
      res_std_momentum: 0.99

    diffusion:
      training_timesteps: 1000
      inference_steps: 50
      # Predict the clean correction x0. With a zero-initialized projection this
      # starts at the identity; a zero epsilon prediction instead amplifies the
      # initial Gaussian latent and is not a zero correction.
      prediction_type: sample
      schedule: cosine
      sampler: ddim
      eta: 0.0
      clip_sample: false
      clip_sample_range: 10.0
      snr_weighting: auto
      snr_gamma: 5.0
      timestep_distribution: auto
      timestep_bias: 3.0
      deterministic_estimator: auto
      deterministic_training_steps: 4

    # Retained for a one-line switch to diffusion_unet. The output projection
    # is independently zero initialized for every packed variable/level.
    unet:
      hidden_channels: 64
      num_levels: 3
      num_residual_blocks: 2
      time_embedding_dim: 128
      dropout: 0.0
      bottleneck_attention: true
      attention_heads: 4
      zero_init_output: true

    transformer:
      patch_size: [8, 8]
      embedding_dim: 256
      num_heads: 8
      num_blocks: 6
      mlp_ratio: 4.0
      dropout: 0.0
      positional_encoding: sincos_2d
      max_tokens_lat: 256
      max_tokens_lon: 512
      attention_mode: windowed_2d
      window_size: [8, 8]
      shifted_windows: true
      gradient_checkpointing: true
      optimized_attention: auto
      zero_init_output: true
      local_refinement: true

  # Optional causal sequence model. Keep it disabled unless a run explicitly
  # trains and validates the temporal objective independently.
  mamba_temporal_enabled: true
  mamba_temporal_channels: 16
  mamba_temporal_state: 8
  mamba_temporal_layers: 2
  mamba_temporal_conv: 3
  mamba_temporal_expand: 2
  model_kwargs: {}

training:
  seed: 42
  batch_size: 1  # Six supervised rollout leads per sample; accumulate below.
  num_epochs: 100
  # Phase 1 Aurora is frozen; train the diffusion correction head only.
  refinement_loss_weight: 1.0
  mamba_temporal_weight: 0.0
  learning_rate: 3.0e-4
  optimizer: adamw
  weight_decay: 0.0
  scheduler: cosine_warmup  # none | cosine | cosine_warmup | step
  # Short warmup: head-only fine-tune from a pretrained backbone doesn't need
  # the paper's 100-step linear warmup (that's for from-scratch pretraining).
  scheduler_warmup_steps: 10
  scheduler_eta_min: 0.0
  scheduler_step_size: 10
  scheduler_gamma: 0.5
  gradient_clip_val: 1.0
  accumulation_steps: 8
  early_stopping:
    # Complete all 100 configured epochs; validation still controls best.ckpt.
    enabled: false
    patience: 3
    min_delta: 1.0e-5
  validation_frequency: 5  # validation runs the full multi-lead rollout over the whole val set; doing it every epoch (=1) roughly doubles per-epoch cost. Validate every 5 epochs.
  # Validate the same deterministic conditional-mean product used at inference.
  validation_refinement_ensemble_size: 1
  skip_validation: false
  validation_source: train_tail  # Keep model selection disjoint from held-out test.nc.
  validation_fraction: 0.1
  # Select in physical space: mean(refined RMSE / Aurora RMSE), grouped by
  # variable, pressure level, and lead. Every target channel must improve.
  checkpoint_metric: mean_physical_rmse_ratio
  require_all_physical_channels_improve: true
  require_refinement_improvement: true
  save_best_only: true
  save_last: true
  # This audited target/scaling/prediction contract is incompatible with the
  # earlier epsilon checkpoint. Start clean; only resume an interrupted run
  # created from this exact contract.
  resume_training: false
  resume_from: ""  # "best", "last", or a path to a .ckpt file. Empty = fresh run.
  resume_skip_scheduler: false
  # MSE for warmup-stage fine-tuning: gradient ∝ (pred-tgt)/std² shrinks as
  # the model converges, which is essential under tight normalisation floors
  # and bf16 autocast. Switch to "mae" only for late-stage rollout fine-tune.
  loss_function: mse
  multi_target_loss_weights: {}

rollout:
  run_rollout_after_training: true
  rollout_num_steps: 0  # 0 = use max(target_lead_times) from data config
  rollout_step_hours: 12
  autoregressive_inputs: true
  # Log, at every rollout step, which variables come from CAMS truth vs the
  # model's bias-corrected prediction (plus assertions that no bias-corrected
  # target is ever overwritten by CAMS). Set false to silence the per-step log.
  verbose_provenance: true
  predicted_fields_get_fed_back: []  # Empty => all configured target variables are fed back.
  keep_exogenous_predictors: refresh_from_dataset  # fixed | refresh_from_dataset
  save_predictions_to_netcdf: true
  smooth_sigma: 0.0  # Keep output scientifically identical to the unsmoothed model field.
  save_plots: true

notebook:
  quicklook_sample_index: 0
  plot_variables:
    - no2
    - tcno2
  verbosity: 1
inference:
  require_validated_checkpoint: true
