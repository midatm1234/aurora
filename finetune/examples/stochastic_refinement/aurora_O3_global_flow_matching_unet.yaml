# Example configuration: existing flow-matching UNet (refinement.type: flow_matching_unet)
#
# Derived, unmodified except where noted, from
# ``finetune/aurora_O3_global_finetune_3day_lead_config.yaml`` (a currently
# working Aurora flow-matching configuration). Existing YAML files are never
# overwritten; this is an additional, explicitly versioned example.
#
# This is the EXISTING Aurora rectified-flow head. `flow_matching` remains a backward-compatible alias and existing checkpoints load unchanged.
#
# See docs/STOCHASTIC_REFINEMENT.md for the full schema.
paths:
  # Preserve the finetune-directory project root used by the source config.
  project_root: ../..
  data_dir: ../data
  data_case_name: O3_global_3day_lead
  train_data_path: ../data/train.nc
  val_data_path: ../data/test.nc
  test_data_path: ../data/test.nc
  output_dir: ./outputs
  checkpoint_dir: ./outputs/checkpoints
  pretrained_checkpoint: ""  # Optional local checkpoint path. Empty uses model default HF checkpoint.
  static_data_path: /data/cams/aurora-0.4-air-pollution-static.pickle  # Pickle with lsm, z, slt (from HuggingFace)
  optional_resume_checkpoint: ""

# Sub-folder under output_dir / checkpoint_dir for this experiment.
# When set, all artifacts (best.ckpt, last.ckpt, training_history.*,
# rollout_predictions.nc, plots, run_manifest.json) land in
#   <output_dir>/<case_name>/  and  <checkpoint_dir>/<case_name>/
# resume_from="best"/"last" resolves relative to the case folder, so
# stages chain naturally when you keep case_name fixed across runs.
case_name: O3_global_3day_lead_flow_matching_unet

# Evaluation settings consumed by evaluate_finetuned_cams_rollouts.ipynb.
# Ground truth, fine-tuned output, result paths, targets, levels, and lead
# times retain their case/config-derived defaults. The baseline rollout
# notebook writes beneath examples/, so only that source needs a path override.
# Global rollout grids intentionally omit the final -90-degree latitude after
# patch cropping; coordinate_intersection selects the common named coordinates
# without resizing or interpolation.
evaluation:
  ground_truth_path: null
  baseline_rollout_path: examples/outputs/cams_rollouts
  finetuned_rollout_path: null
  output_dir: null
  target_variables: null
  levels: null
  spatial_alignment: coordinate_intersection
  # Float32 rollout coordinates differ from test.nc by at most ~1.22e-5
  # degrees; this remains far smaller than the 0.4-degree grid spacing.
  coordinate_tolerance: 2.0e-5
  generate_maps: false
  # Stream all matched initializations/leads into one aggregate spatial
  # comparison map per target and level.
  generate_overall_maps: true

data:
  # v4 uses ALL predictor variables available in CAMS (and supported by the
  # AuroraAirPollution variant). O3 chemistry is coupled to other species
  # (NOx titration/production, CO, SO2, aerosols), so feeding the full set of
  # co-located chemical + meteorological fields gives the model the context it
  # needs to correct the O3 forecast. This is the complete surf + atmos var set
  # of AuroraAirPollution; the bias-correction targets stay identical to v2
  # (go3 at the four loss levels + gtco3 surface column).
  predictor_variables:
    # --- Surface meteorology ---
    - dataset_name: t2m
      aurora_name: 2t
      kind: surf
    - dataset_name: u10
      aurora_name: 10u
      kind: surf
    - dataset_name: v10
      aurora_name: 10v
      kind: surf
    - dataset_name: msl
      aurora_name: msl
      kind: surf
    # --- Surface aerosols / total columns ---
    - dataset_name: pm1
      aurora_name: pm1
      kind: surf
    - dataset_name: pm2p5
      aurora_name: pm2p5
      kind: surf
    - dataset_name: pm10
      aurora_name: pm10
      kind: surf
    - dataset_name: tcco
      aurora_name: tcco
      kind: surf
    - dataset_name: tc_no
      aurora_name: tc_no
      kind: surf
    - dataset_name: tcno2
      aurora_name: tcno2
      kind: surf
    - dataset_name: gtco3
      aurora_name: gtco3
      kind: surf
    - dataset_name: tcso2
      aurora_name: tcso2
      kind: surf
    # --- Atmospheric meteorology ---
    - dataset_name: z
      aurora_name: z
      kind: atmos
    - dataset_name: u
      aurora_name: u
      kind: atmos
    - dataset_name: v
      aurora_name: v
      kind: atmos
    - dataset_name: t
      aurora_name: t
      kind: atmos
    - dataset_name: q
      aurora_name: q
      kind: atmos
    # --- Atmospheric chemical species ---
    - dataset_name: co
      aurora_name: co
      kind: atmos
    - dataset_name: "no"
      aurora_name: "no"
      kind: atmos
    - dataset_name: no2
      aurora_name: no2
      kind: atmos
    - dataset_name: go3
      aurora_name: go3
      kind: atmos
    - dataset_name: so2
      aurora_name: so2
      kind: atmos

  target_variables:
    - dataset_name: go3
      aurora_name: go3
      kind: atmos
      # Compute target loss only at these pressure levels. The full
      # atmospheric level grid remains in data.atmos_levels so Aurora's
      # encoder/decoder and checkpoint shapes stay compatible.
      loss_levels: [1000, 500, 100, 50]
    - dataset_name: gtco3
      aurora_name: gtco3
      kind: surf

  static_variables:
    - dataset_name: lsm
      aurora_name: lsm
      kind: static
    - dataset_name: z_static
      aurora_name: z
      kind: static
    - dataset_name: slt
      aurora_name: slt
      kind: static
    - dataset_name: static_ammonia
      aurora_name: static_ammonia
      kind: static
    - dataset_name: static_ammonia_log
      aurora_name: static_ammonia_log
      kind: static
    - dataset_name: static_co
      aurora_name: static_co
      kind: static
    - dataset_name: static_co_log
      aurora_name: static_co_log
      kind: static
    - dataset_name: static_nox
      aurora_name: static_nox
      kind: static
    - dataset_name: static_nox_log
      aurora_name: static_nox_log
      kind: static
    - dataset_name: static_so2
      aurora_name: static_so2
      kind: static
    - dataset_name: static_so2_log
      aurora_name: static_so2_log
      kind: static

  atmos_levels: [50, 100, 150, 200, 250, 300, 400, 500, 600, 700, 850, 925, 1000]
  input_time_steps: 2
  target_lead_times: [1,2,3,4,5,6]  # Multi-step rollout supervision at these target lead indices (1 step = rollout_step_hours).
  target_type: rollout  # next-step | multi-step | rollout

  domain_type: global  # global | regional
  lat_min: None
  lat_max: None
  lon_min: None
  lon_max: None

  data_format: netcdf  # netcdf | zarr | xarray
  backend: netcdf
  predictor_mapping_to_aurora_names: {}
  target_mapping_from_aurora_outputs: {}
  static_mapping_to_aurora_names: {}

  time_dim: time
  lat_dim: latitude
  lon_dim: longitude
  level_dim: level
  extra_dim_indexers: {}  # Example: {member: 0}

  normalization:
    enabled: false
    mode: none
    input_stats: {}
    target_stats: {}

  split_controls:
    train:
      start_offset: 0
      end_offset: null
      stride: 1
      max_samples: null
    val:
      start_offset: 0
      end_offset: null
      stride: 1
      max_samples: null
    test:
      start_offset: 0
      end_offset: null
      stride: 1
      max_samples: null

  optional_masks_for_missing_values: {}  # Example: {t2m: valid_mask_t2m}

  loss_mask_options:
    mode: none  # none | land | ocean
    threshold: 0.5

  include_target_variables_as_predictors: false
  patch_alignment_strategy: crop

model:
  model_variant: aurora_air_pollution
  patch_size: 3  # AuroraAirPollution uses patch_size=3.
  # Resolve from the canonical training grid. Global grids use circular
  # longitude padding; regional grids retain non-periodic edge padding.
  lon_periodic: auto
  use_pretrained_weights: true
  backbone_freeze: true
  freeze_embeddings: true
  freeze_encoder: true
  freeze_decoder: false
  trainable_head_only: false
  gradient_checkpointing: true
  mixed_precision: bf16  # none | bf16 | fp16
  device: cuda
  compile_model: false
  conv_refine_enabled: false  # Wrap decoder with convolutional refinement heads.
  conv_refine_hidden: 32      # Hidden channels in conv refinement blocks.
  # Rectified-flow residual decoder for bias correction.
  # Trains a small UNet on the conditional residual r = y_true − ŷ in
  # normalised space. Deterministic inference predicts r̂ at the source
  # endpoint and adds it back. Mutually exclusive with conv-refine.
  flow_refine_enabled: false
  # Version 3 adds explicit cumulative forecast-lead conditioning to the
  # corrected t=0 endpoint and per-level residual scaling. Older checkpoints
  # have no lead embedding and are deliberately incompatible with this recipe.
  flow_refine_contract_version: 3
  flow_refine_hidden: 16           # Global full-resolution training needs a small UNet width to fit one H100.
  flow_refine_time_dim: 128        # sinusoidal flow-interpolation-time embedding dim
  # Forecast age is separate from flow interpolation time. Feed cumulative
  # physical lead hours (12, 24, ..., 72) so each head can learn that CAMS
  # rollout residual amplitude and structure evolve with lead. The scale is
  # also the maximum supported lead for inference; longer rollouts fail loudly.
  flow_refine_lead_time_cond: true
  flow_refine_lead_time_scale_hours: 72
  # Optional absolute-position conditioning. When enabled, the Flow head gets
  # sin(lon)/cos(lon), never raw longitude. Enabling changes checkpoint input
  # channels, so leave false when resuming a checkpoint trained without it.
  flow_refine_lon_encoding: false
  # Standardise the residual endpoint before mixing it with unit Gaussian
  # source noise. Without this, O3 residuals (roughly 0.003-0.04 in Aurora
  # normalised units) are overwhelmed by O(1) flow noise.
  flow_refine_residual_zscore: true
  flow_refine_res_std_momentum: 0.99
  flow_refine_sampling_steps: 1    # Deterministic t=0, x0=0 regression.
  # Keep model selection and rollout deterministic. Multi-step stochastic
  # sampling is opt-in and requires explicit ensemble calibration; it is not
  # appropriate for this deterministic bias-correction objective.
  # gtco3 is a smooth, large-scale column field, NOT a sparse multi-modal
  # plume like surface NO2. With the x1 (data) parameterisation, 1 step
  # already yields the residual mean E[r|y_hat]; extra steps only inject
  # stochastic spread, which is exactly the +18% std inflation and the
  # spurious low-ozone blob seen in the v1 fine-tuned rollout. Keep the
  # eval sampler deterministic (1 step) for the column field.
  flow_refine_sampling_steps_late: 1
  # ------------------------------------------------------------------
  # Mamba temporal module (long-lead rollout corrector).
  # Adds a selective state-space (Mamba) corrector on top of the
  # flow-matching output. It learns how the bias-corrected field and
  # Aurora's residual evolve across a rollout sequence, targeting the
  # accumulated drift that degrades 2-3 day forecasts relative to 6 h.
  # The temporal decoder is zero-init (identity-at-init), so the module
  # is a no-op until trained. Trained on the ordered multi-lead sequence
  # (see training.mamba_temporal_weight) and applied causally at rollout.
  # Requires flow_refine_enabled: true and >= 2 target_lead_times.

  # ------------------------------------------------------------------
  # Unified stochastic residual refinement (Phase 2).
  # Phase 1 stays the existing deterministic Aurora rollout. Phase 2 predicts a
  # residual in Aurora's normalized target space for each rollout step and is
  # applied as POSTPROCESSING: the deterministic state that produces later
  # rollout steps is never replaced (feedback_to_rollout: false).
  # ------------------------------------------------------------------
  refinement:
    enabled: true
    type: flow_matching_unet
    checkpoint: null
    freeze_aurora: true
    joint_finetuning: false
    train_on_residual: true
    feedback_to_rollout: false   # experimental when true; evaluate separately
    seed: 1234
    ensemble_size: 1

    target_space:
      use_existing_normalization: true
      residual_space: normalized

    conditioning:
      aurora_rollout: true
      aurora_input_state: false
      aurora_features: false
      static_fields: false
      masks: true
      forecast_lead_time: true   # physical hours; separate from process time

    loss:
      generative: mse
      reconstruction_weight: 0.0
      bias_weight: 0.0
      gradient_weight: 0.0
      pattern_correlation_weight: 0.0
      area_weighted: true
      separate_by_variable: true
      separate_by_level: true
      separate_by_lead_time: true

    flow_matching:
      source_distribution: gaussian
      interpolation_path: existing_aurora  # the Aurora x1 (data) formulation
      integration_steps: 1
      solver: euler
      stochastic_initialization: true
      time_sampling: logit_normal
      sigma_min: 1.0e-3
      logit_normal_mean: -0.5
      logit_normal_std: 1.2
      residual_zscore: true
      res_std_momentum: 0.99

    unet:
      hidden_channels: 16
      num_levels: 3
      num_residual_blocks: 2
      time_embedding_dim: 128
      dropout: 0.0
      bottleneck_attention: true
      attention_heads: 4
      zero_init_output: true

  mamba_temporal_enabled: false
  mamba_temporal_channels: 16   # per-pixel feature width of the encoder/SSM
  mamba_temporal_state: 8       # SSM hidden state dimension (N)
  mamba_temporal_layers: 2      # stacked Mamba blocks
  mamba_temporal_conv: 3        # causal temporal conv kernel
  mamba_temporal_expand: 2      # SSM inner expansion factor
  model_kwargs: {}

training:
  seed: 42
  batch_size: 1  # Global domain + 6 leads + FM head needs per-GPU bs=1; use accumulation for effective batch.
  num_epochs: 50  # fresh finetune at target_lead_times=[1,2,3,4,5,6] from a clean random init of the FM head
  # Fresh stage-1 fine-tune over target_lead_times=[1,2,3,4,5,6] from a clean
  # random init of the FM head, trained jointly at the standard 3e-4 UNet
  # LR so the head learns the multi-lead residual across all leads at once.
  learning_rate: 3.0e-4
  optimizer: adamw
  weight_decay: 0.0
  scheduler: cosine_warmup  # none | cosine | cosine_warmup | step
  # Short warmup: head-only fine-tune from a pretrained backbone doesn't need
  # the paper's 100-step linear warmup (that's for from-scratch pretraining).
  scheduler_warmup_steps: 10
  # scheduler_t_max omitted -> auto-defaults to updates_per_epoch x num_epochs
  # (the full run length), so the cosine decays to eta_min exactly at the last
  # optimizer update. Set an explicit value only to override that span.
  scheduler_eta_min: 0.0
  scheduler_step_size: 10
  scheduler_gamma: 0.5
  gradient_clip_val: 1.0
  accumulation_steps: 32
  # Per-parameter LR scaling by weight RMS. AdamW takes ~unit-magnitude steps
  # in normalised weight units regardless of the parameter's actual scale.
  # Setting this enables the trust-ratio-style per-tensor scaling in
  # aurora_finetune_distributed.py.
  scale_aware_lr:
    enabled: true
    # Reference RMS used as the "1.0×" scale. Params with rms below this
    # get LR proportionally reduced; params above get clipped to 1.0×.
    # If null, computed automatically as the median rms of well-conditioned
    # pretrained params at optimizer construction time.
    reference_rms: null
    # Lower bound on the per-tensor scale factor so vanishingly small params
    # are not completely frozen (only applies to pretrained params).
    min_scale: 1.0e-3
    # rms below this is considered a (near-)zero-init param (e.g. fresh head
    # bias) and is excluded from the reference-rms estimate.
    rms_floor: 1.0e-4
    # Multiplicative LR scale on Aurora-pretrained params. The pretrained
    # Aurora is already near-optimal on CAMS dates similar to its training
    # set (init val_loss < end-of-epoch-1 val_loss in our run); fine-tuning
    # those weights drifts the model AWAY from the optimum. Set this to 0.0
    # to freeze pretrained params entirely and let the convolutional refine
    # heads (newly initialised) absorb the residual biases. The refine
    # heads always run at the full configured `learning_rate`.
    pretrained_lr_scale: 0.0
  early_stopping:
    enabled: true
    patience: 3
    min_delta: 1.0e-5
  validation_frequency: 5
  skip_validation: false
  # Keep model selection disjoint from the held-out test period. A temporal
  # gap equal to the maximum rollout lead is inserted automatically.
  validation_source: train_tail
  validation_fraction: 0.1
  require_refinement_improvement: true
  save_best_only: true
  save_last: true
  # Start one fresh run after the periodic-longitude architecture change;
  # legacy replicate-edge Flow checkpoints are intentionally rejected.
  # The corrected deterministic endpoint and autoregressive feedback contract
  # are not compatible with the previous unvalidated run; start clean.
  resume_training: false
  resume_from: ""  # "best", "last", or a path to a .ckpt file. Empty = no resume.
  resume_skip_scheduler: false  # Restore scheduler state for an interrupted same-run resume.
  # MSE for warmup-stage fine-tuning: gradient ∝ (pred-tgt)/std² shrinks as
  # the model converges, which is essential under tight normalisation floors
  # and bf16 autocast. Switch to "mae" only for late-stage rollout fine-tune.
  loss_function: mse
  multi_target_loss_weights: {}
  # Weight of the Mamba temporal loss (trained on the ordered multi-lead
  # rollout sequence). Only active when model.mamba_temporal_enabled=true
  # and there are >= 2 target lead times. 0 disables the temporal loss term.
  mamba_temporal_weight: 0.0
  # Train each later lead on the same corrected autoregressive state that
  # inference feeds back, while retaining the unrefined prediction as the
  # residual-loss reference.
  flow_refine_autoregressive_feedback: true

  # ---------------------------------------------------------------------
  # Structural auxiliary losses for the flow-matching refine head.
  #
  # The base flow loss is a per-pixel / per-level residual MSE, which has no
  # notion of spatial pattern, extremes, distribution, vertical shape, or the
  # column<->profile relationship — exactly the structures left uncorrected in
  # the rollout-vs-test difference maps. These weighted terms (computed on the
  # head's clean residual estimate refined = ŷ + r̂ vs the target) add those
  # objectives. Set any weight to 0 to disable that term; all-zero reproduces
  # the original pure residual-MSE behaviour.
  flow_aux_loss:
    # Master on/off switch for all structural terms below (single-line toggle).
    enabled: true
    # Extreme-event performance: up-weight squared error on tail cells
    # (|z| above the per-sample quantile) + match spatial peak magnitude.
    extreme_weight: 0.5
    extreme_quantile: 0.95
    extreme_intensity: 4.0
    peak_weight: 0.25
    # Spatial-pattern agreement: gradient-field MSE + anomaly correlation.
    spatial_grad_weight: 0.5
    spatial_acc_weight: 0.25
    # Distributional errors: spatial-std match + sorted-value Wasserstein.
    dist_var_weight: 0.25
    dist_wasserstein_weight: 0.25
    # Apply structural losses to the exact deterministic inference correction.
    aux_on_deterministic: true
    # Directly supervise t=0, x0=0 (the conditional-mean inference query).
    deterministic_reconstruction_weight: 1.0
    # Penalize a correction whenever it increases pointwise squared error
    # relative to making no correction.
    degradation_weight: 1.0
    # Pin domain-wide mean; the previous run omitted this while optimizing ACC.
    bias_weight: 0.5
    # Vertical-profile consistency (atmospheric go3): level-difference MSE.
    vertical_weight: 0.5
    # Column/profile coherence: DISABLED for the column-ozone fine-tune.
    # gtco3 (total-column O3) is stratosphere-dominated (~10-50 hPa), which
    # sits ABOVE the loss_levels [1000,500,100,50] hPa used here, so the
    # Dp-weighted integral of go3 over those levels is a physically wrong
    # proxy for the column and drags gtco3 toward a systematic low bias
    # (the -4% mean error in the v1 rollout). NOTE: this term was already
    # INERT for the NO2 case (its targets are no2/tcno2, so the hard-coded
    # gtco3/go3 pair never resolves) -- so zeroing it here makes the O3
    # recipe match the working NO2 recipe. The distribution (dist_var,
    # dist_wasserstein) and spatial-pattern (spatial_grad, spatial_acc)
    # terms stay ON, as in NO2.
    coherence_weight: 0.0
    coherence_column_var: gtco3
    coherence_profile_var: go3

rollout:
  run_rollout_after_training: true
  rollout_num_steps: 0  # 0 = use max(target_lead_times) from data config
  rollout_step_hours: 12
  autoregressive_inputs: true
  # Log, at every rollout step, which variables come from CAMS truth vs the
  # model's bias-corrected prediction (plus assertions that no bias-corrected
  # target is ever overwritten by CAMS). Set false to silence the per-step log.
  verbose_provenance: true
  predicted_fields_get_fed_back: []  # Empty => all model-predicted vars are fed back.
  keep_exogenous_predictors: refresh_from_dataset  # fixed | refresh_from_dataset
  save_predictions_to_netcdf: true
  # Do not apply output-only smoothing that was absent from training and from
  # the baseline product. Diagnose patch artifacts separately.
  smooth_sigma: 0.0
  save_plots: true

inference:
  # Refuse checkpoints such as the previous last.ckpt whose best_val_loss=inf.
  require_validated_checkpoint: true

notebook:
  quicklook_sample_index: 0
  plot_variables:
    - go3
    - gtco3
  verbosity: 1

performance:
  profile: false
  dataloader:
    num_workers: auto
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    non_blocking_transfer: true
  precision:
    mode: fp32
    allow_tf32: false
  compile:
    enabled: false
    aurora: false
    refinement: false
  rollout_cache:
    enabled: false
    path: null
    validate_cache: true
  conditioning_cache:
    enabled: false
    path: null
    validate_cache: true
  ensemble:
    batch_members: true
    chunk_size: auto
  io:
    atomic_checkpoints: true
    netcdf_compression: true
    netcdf_compression_level: 4
