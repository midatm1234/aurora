name: Portable air-pollution workflow
on: [push, pull_request]
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/workflow-light.txt
      - run: python -m pytest --confcutdir=tests/workflow tests/workflow/test_core.py tests/workflow/test_mcp.py tests/workflow/test_knowledge.py
  cpu-science:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/bootstrap_workflow.py --venv /tmp/aurora-cpu --science
      - run: /tmp/aurora-cpu/bin/python -m pytest --confcutdir=tests/workflow tests/workflow
        env:
          CUDA_VISIBLE_DEVICES: ''
          OMP_NUM_THREADS: '1'
          HF_HUB_OFFLINE: '1'
      - name: Refinement and notebook contract regressions
        run: >-
          /tmp/aurora-cpu/bin/python -m pytest -q
          tests/test_refinement_*.py tests/test_checkpoint*.py
          tests/test_flow_refine_contract.py tests/test_distributed_refinement_contract.py
          tests/test_mamba*.py tests/test_no2_diffusion_transformer_workflow.py
          tests/test_finetune_config_compatibility.py tests/test_prepare_train_test_from_netcdf.py
          tests/test_overall_evaluation_maps.py tests/test_evaluation_selection.py
          tests/test_inference_yaml_period.py tests/test_spatiotemporal_tools.py
          tests/test_case_data_paths.py tests/test_trace_refinement_batch.py
          tests/test_longitude_periodicity.py tests/test_diagnose_refinement.py
        env:
          CUDA_VISIBLE_DEVICES: ''
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          HF_HUB_OFFLINE: '1'
